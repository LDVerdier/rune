version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:20.18
    working_directory: ~/project

jobs:
  install:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "package-lock.json" }}
            - deps-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  lint:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint
          command: npm run lint

  typecheck:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Typecheck
          command: npm run typecheck

  test:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: npm test

  build:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build
          command: npm run build

  deploy:
    executor: node
    steps:
      - run:
          name: Deploy to Render
          command: curl -s "$RENDER_DEPLOY_HOOK_URL"

workflows:
  ci:
    jobs:
      - install
      - lint:
          requires:
            - install
      - typecheck:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - install
      - deploy:
          requires:
            - lint
            - typecheck
            - test
            - build
          filters:
            branches:
              only: main
